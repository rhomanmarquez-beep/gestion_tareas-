<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio - Tareas</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-left">
      <a href="inicio-pagina.html" class="logo">Tareas</a>
    </div>
    <a href="registro.html" class="btn-nav">Ir a tus tableros</a>
  </nav>

  <section class="hero-container">
    <div class="hero-content">
      <h1 class="hero-title">Captura, organiza y gestiona tus pendientes desde cualquier lugar.</h1>
      <p class="hero-description">
        Escapa del desorden y el caos; desata tu productividad con Tareas.
      </p>

      <form action="registro.html" method="GET" class="hero-form">
        <input type="email" id="heroEmail" name="email" class="input-field input-email" placeholder="Introduce tu correo electrónico" required>
        <button type="submit" class="btn-submit">¡Regístrate, es gratis!</button>
      </form>
    </div>

    <div class="hero-image-container">
      <!-- Imagen actualizada desde el enlace proporcionado -->
      <img src="https://www.muycomputer.com/wp-content/uploads/2023/04/gestion_de_tareas-560x600.jpg" alt="Gestión de Tareas">
    </div>
  </section>

</html>
