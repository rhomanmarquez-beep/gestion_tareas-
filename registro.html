<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regístrate en Tareas</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body class="centered-layout">

  <div class="auth-card">
    <div class="logo-container">
      <span class="logo-text">Tareas</span>
    </div>

    <h1 class="auth-title">Regístrate en Tareas</h1>

    <form action="login.html" method="GET">
      <div class="form-control">
        <label for="email">Correo</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="input-field" 
          placeholder="nombre@ejemplo.com" 
          required
        >
      </div>

      <button type="submit" class="btn-submit" style="width: 100%;">Registrarse</button>
    </form>
  </div>

</body>
</html>
